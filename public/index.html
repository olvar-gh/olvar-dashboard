<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Olvar</title>
    <!--
      Pages are documents that the browser scrolls (docs/PLAN.md §5.4), so unlike Expo's default
      reset the body is not locked to the viewport: #root starts at the window height and grows
      with the page.
    -->
    <style id="expo-reset">
      html {
        height: 100%;
        background-color: #fafaf7;
      }
      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
