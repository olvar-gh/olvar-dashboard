# Runs on every pull request: lint, typecheck, unit tests, web export, expo-doctor.
name: CI

on:
  pull_request: {}

jobs:
  checks:
    name: Lint, typecheck, test, export web
    runs_on: linux-medium
    env:
      EXPO_PUBLIC_DATA_SOURCE: fixtures
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Export web
        run: npx expo export -p web
      - name: expo-doctor
        run: npx expo-doctor
