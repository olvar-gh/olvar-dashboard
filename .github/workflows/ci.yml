name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: No em dashes
        run: |
          if git grep -n $'\u2014' -- .; then
            echo "Replace the em dashes above (project rule, AGENTS.md)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  web-export:
    name: Web export (Cloudflare Pages)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_DATA_SOURCE: fixtures
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
      - run: node scripts/check-web-export.js dist
      - run: scripts/smoke-pages.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
